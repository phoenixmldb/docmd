name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to a branch cancels the first: the older run's answer is about code nobody
# is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The performance gate budgets each transform in wall-clock time. A shared runner is
      # slower and noisier than a workstation, so the budget is raised here; the assertion
      # that actually detects a regression is a ratio and is unaffected.
      DOCMD_PERF_BUDGET_MS: 90000

    steps:
      - uses: actions/checkout@v7
        with:
          # Commit messages are checked below, so the log has to be there to check.
          fetch-depth: 50

      # A corpus document's filename names the customer. The build fails on one appearing in a
      # tracked file (NoRealDocumentNamesTests); this covers commit messages, which are the
      # half that cannot be corrected after publication without rewriting history.
      - name: Refuse a real document name in commit messages
        run: |
          allowed=$(grep -vE '^\s*(#|$)' .allowed-document-names | tr 'A-Z' 'a-z' | tr -d ' ')
          found=$(git log --pretty=%B -n 30 \
            | grep -oiE '\b[A-Za-z0-9][A-Za-z0-9._-]*\.(docx|docm|dotx|dotm|pptx|pptm|potx|ppt|xlsx|xlsm|doc)\b' \
            | tr 'A-Z' 'a-z' | sort -u || true)
          bad=""
          for name in $found; do
            echo "$allowed" | grep -qxF "$name" || bad="$bad $name"
          done
          if [ -n "$bad" ]; then
            echo "Commit messages name documents that are not on the allow-list:$bad"
            echo "Corpus documents belong to customers and their filenames identify them."
            echo "Describe the document instead, or add the name to .allowed-document-names."
            exit 1
          fi
          echo "commit messages: no real document names"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # global.json selects SDK 11; the 10 runtime runs the net10.0 tests.
          dotnet-version: '10.0.x'

      # The engines depend on ICU for normalize-unicode(), UCA collations and regex
      # character classes. DOTNET_SYSTEM_GLOBALIZATION_INVARIANT overrides the
      # InvariantGlobalization=false in Directory.Build.props and produces WRONG ANSWERS
      # rather than errors, so assert it is unset rather than trusting the image.
      - name: Refuse to build without ICU
        run: |
          if [ -n "${DOTNET_SYSTEM_GLOBALIZATION_INVARIANT:-}" ]; then
            echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT is set; docmd produces incorrect"
            echo "output under invariant globalization. Refusing to build."
            exit 1
          fi
          echo "ICU globalization: ok"

      # --locked-mode is the point of committing packages.lock.json: it fails rather than
      # silently resolving a transitive dependency to something new. A lock file that is
      # never enforced is a file, not a lock.
      - name: Restore (locked)
        run: dotnet restore docmd.slnx --locked-mode

      - name: Build
        run: dotnet build docmd.slnx --no-restore -c Release

      # The performance gate is excluded here and run alone below. Timing a transform while
      # another test assembly saturates the CPU measures the runner, not the code, and it
      # flaked about one run in four when they shared a process.
      - name: Test
        run: >
          dotnet test docmd.slnx --no-build -c Release --verbosity normal
          --filter "FullyQualifiedName!~TransformScaling"

      - name: Performance gate
        run: >
          dotnet test tests/Docmd.Word.Tests --no-build -c Release --verbosity normal
          --filter "FullyQualifiedName~TransformScaling"

      # Proves the tool actually runs, which building a library does not. A packaging or
      # embedded-resource mistake shows up here and nowhere else in this job.
      # Both builds the tool ships; dotnet run needs --framework once the CLI has two targets.
      - name: Smoke test the CLI
        run: |
          for tfm in net10.0 net11.0; do
            echo "== $tfm"
            dotnet run --project src/Docmd.Cli --no-build -c Release -f "$tfm" -- --version
            dotnet run --project src/Docmd.Cli --no-build -c Release -f "$tfm" -- --print-stylesheet \
              | python3 -c "import sys,xml.parsers.expat; p=xml.parsers.expat.ParserCreate(); p.Parse(sys.stdin.buffer.read(),True); print('embedded stylesheet parses')"
          done

  # The same build and tests on SDK 10. global.json pins SDK 11; this job repoints it, so the
  # projects build net10.0 alone (Directory.Build.props adds net11.0 only on SDK 11). It proves
  # those builds need nothing from SDK 11, and that a host still on SDK 10 can build.
  build-sdk10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Select SDK 10
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open("global.json"))
          g["sdk"] = {"version": "10.0.100", "rollForward": "latestFeature"}
          json.dump(g, open("global.json", "w"), indent=2)
          PY
          dotnet --version
          case "$(dotnet --version)" in 10.*) ;; *) echo "::error::expected SDK 10"; exit 1 ;; esac

      # Unlocked: the lock files also cover net11.0, which SDK 10 does not build, so
      # --locked-mode would refuse them. The build job enforces the lock.
      - name: Restore
        run: |
          dotnet restore docmd.slnx

      - name: Build
        run: |
          dotnet build docmd.slnx --no-restore -c Release

      - name: Test
        run: |
          dotnet test docmd.slnx --no-build -c Release --filter "FullyQualifiedName!~TransformScaling"

