name: Release

# Publishing is driven by a tag, so the thing published is always a commit that exists and can
# be checked out again. A manual run is available for a dry run, which packs and verifies but
# does not push.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  # Required for NuGet trusted publishing: the job proves its identity to nuget.org with a
  # short-lived OIDC token instead of a long-lived API key stored as a secret.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A tag that disagrees with the version in the tree publishes a package whose number
      # means nothing. Catch it before anything is built, not after it is on nuget.org.
      - name: Tag must match the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tree=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          tag="${GITHUB_REF_NAME#v}"
          echo "tree=$tree tag=$tag"
          if [ "$tree" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$tree</Version>."
            exit 1
          fi

      # The publish below passes --skip-duplicate, so re-tagging an already-published version
      # SUCCEEDS while uploading nothing: the run goes green, the release notes say 0.2.5
      # shipped, and what is on nuget.org is the older bytes. A published version can never be
      # replaced, only unlisted, which makes publishing the one irreversible step here and the
      # one worth a gate of its own. Before this existed the check was a human remembering to
      # look.
      #
      # Unreachable nuget.org is a FAILURE, deliberately. A check that passes when it cannot
      # verify anything is worse than no check, and this repository has spent real effort
      # removing that failure mode elsewhere. A 404 on the index is NOT that: it means the
      # package has never been published, which is the correct state for a first release.
      #
      # Known window: the flat-container listing lags a push by a few minutes (measured at
      # roughly four for 0.2.5), so re-tagging within that window would still slip through.
      # That is a narrower hole than the one this closes, and closing it completely would mean
      # trusting an index that is slower still.
      - name: Version is not already published
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          FEED: https://api.nuget.org/v3-flatcontainer/docmd.cli/index.json
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          # curl's -w already prints 000 on a connection failure, so do not append another.
          code=$(curl -sS -o /tmp/published.json -w '%{http_code}' --max-time 20 --retry 2 "$FEED") || true
          code=${code:-000}
          if [ "$code" = "404" ]; then
            echo "docmd.cli is not on nuget.org at all; $version would be the first release."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Could not reach nuget.org to check whether $version is already published (HTTP $code). Refusing to publish rather than assuming it is new."
            exit 1
          fi
          if VERSION="$version" python3 -c "import json,os,sys; sys.exit(0 if os.environ['VERSION'] in json.load(open('/tmp/published.json'))['versions'] else 1)"; then
            echo "::error::$version is already published on nuget.org. A published version cannot be replaced, only unlisted. Bump <Version> and tag the new number."
            exit 1
          fi
          echo "$version is not on nuget.org; safe to publish."

      - name: Restore (locked)
        run: dotnet restore docmd.slnx --locked-mode

      - name: Build
        run: dotnet build docmd.slnx --no-restore -c Release

      # The full suite, including the performance gate, which runs alone for the same reason
      # it does in CI: timing a transform while another assembly saturates the CPU measures
      # the runner rather than the code.
      - name: Test
        run: >
          dotnet test docmd.slnx --no-build -c Release
          --filter "FullyQualifiedName!~TransformScaling"

      - name: Performance gate
        env:
          DOCMD_PERF_BUDGET_MS: 90000
        run: >
          dotnet test tests/Docmd.Word.Tests --no-build -c Release
          --filter "FullyQualifiedName~TransformScaling"

      - name: Pack
        run: dotnet pack src/Docmd.Cli --no-build -c Release -o ./artifacts

      # CONTRIBUTING requires installing from the package before pushing it, and this is that
      # rule made unskippable. Building a library proves less than it looks here: the
      # stylesheet ships as an embedded resource, so a packaging mistake surfaces when the
      # tool runs and nowhere earlier.
      - name: Install from the package and run it
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          dotnet tool install --tool-path ./verify --add-source ./artifacts Docmd.Cli --version "$version"
          ./verify/docmd --version
          ./verify/docmd --print-stylesheet \
            | python3 -c "import sys,xml.parsers.expat; p=xml.parsers.expat.ParserCreate(); p.Parse(sys.stdin.buffer.read(),True); print('embedded stylesheet parses')"

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

      # Trusted publishing: exchange the workflow's OIDC identity for a short-lived key. No
      # API key is stored anywhere, so there is nothing to leak or rotate.
      #
      # This runs on a dry run too, deliberately. Authentication is the only step that has ever
      # failed here, and a rehearsal that skips the part that breaks is not a rehearsal. Minting
      # a short-lived credential and not using it costs nothing.
      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # The only step gated on being a real release. A dry run reaches here having proved
      # everything except the push itself.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Dry run summary
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || inputs.dry-run == true }}
        run: |
          echo "Dry run complete. Packed, tested, installed from the package, and authenticated"
          echo "to nuget.org. Nothing was published."
          echo "To release: git tag v<version> && git push origin v<version>" 
